name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  package:
    # The tests compile and run real programs: the V compiler and the Clang toolchain both run in
    # Node, off the assets that ship in the package, so no browser and no extra setup are needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
